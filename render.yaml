services:
  - type: web
    name: neurosaathi
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd web && npm install && npm run build && cd .."
    startCommand: "python backend/prod_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.10.0
      - key: PORT
        value: 10000
