version: '3.8'

services:
  neurosaathi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurosaathi-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_ENV=production
    volumes:
      # Persist SQLite database across container upgrades/restarts
      - neurosaathi-data:/app/backend/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  neurosaathi-data:
    driver: local
